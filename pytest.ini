[tool:pytest]
# Simple pytest configuration for zjets_omnifold1 project

# Path
pythonpath = . ./top_subtraction ./utils

# Test discovery - ONLY look in specific test directories
testpaths = 
    ./tests
    ./top_subtraction/tests

# Test file patterns
python_files = test_*.py

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    serial: Serial tests
    gpu: Tests requiring GPU
    plotting: Tests involving plotting
    file_io: Tests involving file I/O

# Minimum version
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Exclude problematic directories
norecursedirs = 
    .git
    .github
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    .*
    lightning_logs
    wandb
    plot_storage
    weight_storage
    outfiles
    checkpoints
    dataloc
    fastjet
    assets
    experiments
    cli
    of_transformer
    utils