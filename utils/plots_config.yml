# This file contains configurations for all histograms of the data.
# Default settings for histograms are stored in the "defaults" anchor.

defaults: &default_plot
  histtype: "bar"
  density: true
  linear_yscale: false
  log_xscale: false
  symlog_xscale: false
  nbins: 150
  binlow: 0
  binhigh: 200
  ylim: null
  ylabel: "A.U."
  rlim:
    - 0.5
    - 1.5
  w1_eval: true
  truth_mc: false
  truth_data: false
  verbosity_level: 1
  type: "precomputed"
  multifold: true
  ibu: true
  modified: []

# The following sections define the configurations for different histograms.
# Each section can override the default settings as needed.

plots:

  pT_l1:
    <<: *default_plot
    key: "pT_l1"
    xlabel: '$p_{T,\mu1}$ [GeV]'
    binlow: 0
    binhigh: 1000
    ibubins: 
      - 25.0
      - 125.0
      - 200.0
      - 300.0
      - 400.0
      - 600.0
      - 800.0
    region_bins:
      "1":
        - 125.0
        - 200.0
        - 300.0
        - 400.0
        - 500.0
        - 800.0
    verbosity_level: 1
    modified: ["muon_id", "muon_ms", "muon_resbias", "muon_rho", "muon_scale"]

  pT_l2:
    <<: *default_plot
    key: "pT_l2"
