# This is a config file for the Omnifold algorithm
# It was created on 2025-04-18 11:10:30.503924


# Path to the configuration file
config_path: 'test_config'

# Run in debug mode (single device, muons only)
debug: False

# Run in interactive mode with progress bars
interactive: False

# Number of iterations to run the Omnifold algorithm
num_iterations: 1

# Path to checkpoint which will be used as the starting pointfor all iterations
pretrain_checkpoint: ./assets/full_checkpoint.ckpt

# Path to the source file to use in pretraining
pretrain_source_path: ./assets/evts_200_300.root

# Path to the target file to use in pretraining
pretrain_target_path: ./assets/evts_000_100.root

# Path for the MC training data
mc_train_path: ./assets/evts_000_100.root

# Path for the MC testing data
mc_test_path: ./assets/evts_100_200.root

# Path for the data
data_path: ./assets/evts_200_300.root

# Path to the truth pseudodata
truth_data_path: ./assets/truth_evts_000_100.root

# ('Seed for the train / validation split, set to -1 to produce randomseed at train time',)
split_seed: -1

# Maximum number of tracks to use in the data
max_tracks: 264

# Maximum number of events to use in the target data
max_events_target: 500000

# Keyword of the systematic variation to apply to MC. If this is None, then no systematic variation is used
syst_kw: null

# Batch size for training
batch_size: 10

# Batch size for testing
test_batch_size: 100

# Number of top checkpoints to save
top_k_checkpoints: 1

# Number of epochs to wait before stopping training
early_stopping_patience: 1

# Number of GPUs to use for training
num_gpus: 0

# Number of nodes to use for training
num_nodes: 1

# Weight decay for the optimizer
weight_decay: 0.010000000

# Minimum learning rate for pre-training
pt_min_lr: 0.000010000

# Maximum learning rate for pre-training
pt_max_lr: 0.000100000

# Maximum number of steps to run pre-training
pt_max_steps: 1000

# Number of steps to warm up the learning rate for pre-training
pt_warmup_steps: 2000

# Number of steps in a cosine cycle for pre-training
pt_cos_steps: 50000

# Number of steps in a linear cycle for pre-training
pt_linear_steps: 150000

# Minimum learning rate for step one training
s1_min_lr: 0.000008000

# Maximum learning rate for step one training
s1_max_lr: 0.000500000

# Maximum number of steps to run step one training
s1_max_steps: 1000

# Number of steps to warm up the learning rate for step one training
s1_warmup_steps: 0

# Number of steps in a cosine cycle for step one training
s1_cos_steps: 3000

# Number of steps in a linear cycle for step one training
s1_linear_steps: 5000

# Decay with iteration for step one trainings maximum learning rate
s1_lr_decay: 1.000000000

# Minimum learning rate for step two training
s2_min_lr: 0.000050000

# Maximum learning rate for step two training
s2_max_lr: 0.000100000

# Maximum number of steps to run step two training
s2_max_steps: 2000

# Number of steps to warm up the learning rate for step two training
s2_warmup_steps: 0

# Number of steps in a cosine cycle for step two training
s2_cos_steps: 15000

# Number of steps in a linear cycle for step two training
s2_linear_steps: 45000

# Decay with iteration for step two trainings maximum learning rate
s2_lr_decay: 0.700000000

# The minimum number of steps for selecting a checkpoint in the Omnifold iterations
min_checkpoint_steps: 2000

# Use wandb for logging
wandb: False

# Name of the wandb project
project_name: test-of

# Name of the wandb group for all training runs
group_name: test-of-run

# Directory in which save model checkpoints
checkpoint_dir: ./checkpoints

# Input dimension for the model
input_dim: 10

# Pair input dimension for the model
pair_input_dim: 4

# Remove self pair from the model
remove_self_pair: False

# Use the sequence trimmer in training the model
run_trimmer: False

# Embedding dimensions for the model
embed_dims: [128, 512, 128]

# Pair embedding dimensions for the model
pair_embed_dims: [64, 64, 64]

# Number of heads for the model
num_heads: 8

# Number of layers for the model
num_layers: 6

# Dropout rate to use in regular attention blocks
block_dropout: 0.000000000

# Attention dropout rate to use in regular attention blocks
block_attn_dropout: 0.000000000

# Activation dropout rate to use in regular attention blocks
block_activation_dropout: 0.000000000

# Number of classification layers for the model
num_cls_layers: 1

# Dropout rate to use in classification attention blocks
cls_block_dropout: 0.000000000

# Attention dropout rate to use in classification attention blocks
cls_block_attn_dropout: 0.000000000

# Activation dropout rate to use in classification attention blocks
cls_block_activation_dropout: 0.000000000

# Fully connected nodes for the model
fc_nodes: [256, 256]

# Dropout rate to use in fully connected layers
fc_dropout: 0.000000000
